<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест — Алхимичка</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<style>
  /* ═══ ИКОНКИ ═══ */
  .ico {
    width: 18px; height: 18px;
    flex-shrink: 0;
    stroke: currentColor;
    stroke-width: 1.75;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: inline-block;
    vertical-align: middle;
  }
  .ico-lg { width: 22px; height: 22px; stroke-width: 1.5; }
  .ico-sm { width: 15px; height: 15px; stroke-width: 2; }
  .tt-back .ico { margin-right: 4px; vertical-align: -3px; }

  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(14,165,233,.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(106,76,255,.08), transparent 40%),
      var(--light);
    min-height: 100vh;
  }
  html.dark body {
    background:
      radial-gradient(circle at 15% 20%, rgba(14,165,233,.12), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(122,92,255,.12), transparent 40%),
      var(--light);
  }
  .tt-wrap { max-width: 820px; margin: 0 auto; padding: 32px 24px 140px; }

  .tt-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .tt-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--gray);
    font-size: 14px;
    font-weight: 600;
    transition: color .2s;
  }
  .tt-back:hover { color: var(--accent-dark); }

  .tt-progress-wrap {
    background: var(--white);
    border-radius: 999px;
    height: 12px;
    overflow: hidden;
    border: 1.5px solid var(--border);
    margin-bottom: 8px;
  }
  .tt-progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #38bdf8, var(--primary));
    transition: width .5s cubic-bezier(.2,.8,.3,1);
  }
  .tt-counter {
    text-align: center;
    color: var(--gray);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 28px;
  }

  .tt-timer-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(106,76,255,.12), rgba(106,76,255,.04));
    border: 1.5px solid rgba(106,76,255,.28);
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 16px;
    transition: all .3s ease;
  }
  .tt-timer-panel .ico { color: var(--primary); }
  html.dark .tt-timer-panel {
    background: linear-gradient(135deg, rgba(122,92,255,.18), rgba(122,92,255,.06));
    border-color: rgba(122,92,255,.4);
    color: #b8a6ff;
  }
  html.dark .tt-timer-panel .ico { color: #b8a6ff; }
  .tt-timer-panel .tt-timer-label { font-size: 14px; opacity: .8; }
  .tt-timer-panel .tt-timer-value {
    font-family: 'Consolas', monospace;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 2px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.6);
  }
  html.dark .tt-timer-panel .tt-timer-value {
    background: rgba(15,15,30,.7);
    color: #fff;
  }
  .tt-timer-panel.tt-timer-warn {
    background: linear-gradient(135deg, rgba(255,170,0,.14), rgba(255,170,0,.04));
    border-color: rgba(255,170,0,.32);
    color: #c47f00;
  }
  .tt-timer-panel.tt-timer-warn .ico { color: #c47f00; }
  .tt-timer-panel.tt-timer-warn .tt-timer-value { background: rgba(255,255,255,.7); }
  .tt-timer-panel.tt-timer-danger {
    background: linear-gradient(135deg, rgba(224,67,92,.16), rgba(224,67,92,.05));
    border-color: rgba(224,67,92,.38);
    color: var(--danger);
    animation: timerPulse 1s ease-in-out infinite;
  }
  .tt-timer-panel.tt-timer-danger .ico { color: var(--danger); }
  .tt-timer-panel.tt-timer-danger .tt-timer-value { background: rgba(255,255,255,.75); }
  @keyframes timerPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }

  .question-card {
    background: var(--white);
    border-radius: 24px;
    padding: 32px;
    border: 1.5px solid var(--border);
    margin-bottom: 20px;
    animation: slideIn .5s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-num-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(14,165,233,.14), rgba(14,165,233,.04));
    color: var(--accent-dark);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .q-type-hint {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .q-type-hint.single { background: rgba(106,76,255,.12); color: var(--primary); }
  .q-type-hint.multi  { background: rgba(14,165,233,.14); color: var(--accent-dark); }
  .q-type-hint.open   { background: rgba(255,170,0,.15); color: #c47f00; }
  .q-type-hint .ico { width: 12px; height: 12px; stroke-width: 2.5; margin-right: 3px; vertical-align: -2px; }

  .q-text {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 24px;
    letter-spacing: -.3px;
    color: var(--dark);
  }

  .options { display: flex; flex-direction: column; gap: 12px; }

  .opt {
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 18px 20px;
    border-radius: 16px;
    background: var(--light);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all .2s ease;
    user-select: none;
  }
  .opt:hover {
    background: rgba(14,165,233,.06);
    border-color: rgba(14,165,233,.3);
    transform: translateX(4px);
  }
  .opt.selected {
    background: linear-gradient(135deg, rgba(14,165,233,.12), rgba(14,165,233,.04));
    border-color: var(--accent);
    transform: translateX(6px);
    box-shadow: 0 12px 24px -14px rgba(14,165,233,.5);
  }
  .opt .key {
    width: 36px; height: 36px;
    border-radius: 12px;
    background: var(--white);
    display: grid; place-items: center;
    font-weight: 800;
    font-size: 15px;
    color: var(--gray);
    flex-shrink: 0;
    transition: all .2s;
    border: 1.5px solid var(--border);
  }
  .opt.selected .key {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    border-color: transparent;
    transform: scale(1.05);
  }
  .opt .text { flex: 1; font-size: 15.5px; font-weight: 500; color: var(--dark); }
  .opt .mark {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: var(--white);
    display: grid; place-items: center;
    color: transparent;
    flex-shrink: 0;
    transition: all .2s;
  }
  .opt .mark .ico { width: 14px; height: 14px; stroke-width: 3; }
  .opt.selected .mark {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .opt.radio .mark { border-radius: 50%; }

  .open-block { display: flex; flex-direction: column; gap: 16px; }
  .open-hint {
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(255,170,0,.08);
    border-left: 3px solid #ffaa00;
    font-size: 13px;
    color: var(--dark);
  }
  .open-textarea {
    width: 100%;
    min-height: 140px;
    padding: 16px;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    background: var(--white);
    color: var(--dark);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: all .2s;
  }
  html.dark .open-textarea { background: #0f0f1e; }
  .open-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(14,165,233,.12);
  }
  .open-file-zone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    background: var(--light);
    cursor: pointer;
    transition: all .2s;
  }
  .open-file-zone:hover,
  .open-file-zone.dragover {
    border-color: var(--accent);
    background: rgba(14,165,233,.06);
  }
  .open-file-zone .icon {
    display: grid; place-items: center;
    margin-bottom: 6px;
    color: var(--accent-dark);
  }
  .open-file-zone .icon .ico { width: 30px; height: 30px; stroke-width: 1.5; }
  .open-file-zone .label { font-size: 14px; font-weight: 700; color: var(--dark); }
  .open-file-zone .sub   { font-size: 12px; color: var(--gray); margin-top: 4px; }

  .file-attached {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(14,165,233,.08), rgba(106,76,255,.05));
    border: 1.5px solid var(--border);
  }
  .file-attached .fi {
    display: grid; place-items: center;
    color: var(--accent-dark);
  }
  .file-attached .fi .ico { width: 24px; height: 24px; }
  .file-attached .fn { flex: 1; font-weight: 700; font-size: 14px; word-break: break-all; color: var(--dark); }
  .file-attached .fs { font-size: 12px; color: var(--gray); }
  .file-attached .fx {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: grid; place-items: center;
    background: var(--white);
    border: 1.5px solid var(--border);
    color: var(--gray);
    cursor: pointer;
    transition: all .2s;
  }
  .file-attached .fx .ico { width: 14px; height: 14px; }
  .file-attached .fx:hover {
    background: rgba(224,67,92,.1);
    border-color: var(--danger);
    color: var(--danger);
  }

  .tt-footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 20px 24px;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(12px);
    border-top: 1.5px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 40;
  }
  html.dark .tt-footer { background: rgba(15,15,30,.92); }
  .tt-footer .inner {
    max-width: 820px;
    width: 100%;
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
  }

  .result-wrap {
    background: var(--white);
    border-radius: 28px;
    padding: 48px 40px;
    border: 1.5px solid var(--border);
    text-align: center;
    animation: slideIn .6s ease;
    position: relative;
    overflow: hidden;
  }
  .result-wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--accent), #38bdf8, var(--primary));
  }
  .result-emoji {
    display: grid; place-items: center;
    margin-bottom: 16px;
    animation: popEmoji .6s cubic-bezier(.2,.8,.3,1);
  }
  .result-emoji .ico { width: 80px; height: 80px; stroke-width: 1; }
  .result-emoji.trophy .ico { color: #ffaa00; }
  .result-emoji.good .ico { color: var(--accent-dark); }
  .result-emoji.weak .ico { color: var(--danger); }
  @keyframes popEmoji {
    0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .result-title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.5px;
    margin-bottom: 8px;
    color: var(--dark);
  }
  .result-sub { color: var(--gray); font-size: 15px; margin-bottom: 32px; }

  .result-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .chart-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin: 8px 0 32px;
  }
  .donut {
    position: relative;
    width: 220px;
    height: 220px;
  }
  .donut svg {
    transform: rotate(-90deg);
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 12px 30px rgba(14,165,233,.25));
  }
  .donut .donut-bg { stroke: var(--border); fill: none; }
  .donut .donut-fg { fill: none; stroke-linecap: round; }
  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .donut-pct {
    font-size: 46px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--accent), var(--primary));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .donut-sub {
    font-size: 12px;
    font-weight: 700;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stats-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 8px;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-radius: 14px;
    background: var(--white);
    border: 1.5px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    min-width: 140px;
    color: var(--dark);
  }
  .stat-chip .ic {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .stat-chip .ic .ico { width: 16px; height: 16px; }
  .stat-chip.correct .ic { background: rgba(14,165,233,.15); color: var(--accent-dark); }
  .stat-chip.wrong   .ic { background: rgba(224,67,92,.12); color: var(--danger); }
  .stat-chip.total   .ic { background: rgba(106,76,255,.12); color: var(--primary); }
  .stat-chip .num {
    font-size: 18px;
    font-weight: 800;
    line-height: 1;
    color: var(--dark);
  }
  .stat-chip .lbl {
    font-size: 11px;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 700;
  }

  .verdict {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .verdict.excellent { background: rgba(14,165,233,.14); color: var(--accent-dark); }
  .verdict.good      { background: rgba(106,76,255,.12); color: var(--primary); }
  .verdict.weak      { background: rgba(224,67,92,.12); color: var(--danger); }

  .detail-heading {
    font-size: 20px;
    font-weight: 800;
    text-align: left;
    margin-bottom: 16px;
    padding-top: 24px;
    border-top: 1.5px dashed var(--border);
    color: var(--dark);
  }
  .detail-list { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .detail-item {
    padding: 18px;
    border-radius: 16px;
    background: var(--light);
    border-left: 4px solid var(--gray);
  }
  html.dark .detail-item { background: #0f0f1e; }
  .detail-item.correct { border-left-color: var(--accent); background: rgba(14,165,233,.05); }
  .detail-item.wrong   { border-left-color: var(--danger); background: rgba(224,67,92,.05); }
  .detail-item.partial { border-left-color: #ffaa00; background: rgba(255,170,0,.06); }
  .detail-item.pending { border-left-color: #6a4cff; background: rgba(106,76,255,.05); }
  .detail-q {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    color: var(--dark);
  }
  .detail-q .ico { flex-shrink: 0; margin-top: 2px; }
  .detail-answers {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-left: 4px;
    font-size: 14px;
  }
  .detail-answers .row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .detail-answers .lbl {
    min-width: 130px;
    color: var(--gray);
    font-weight: 600;
    font-size: 13px;
  }
  .detail-answers .val { color: var(--dark); }
  .detail-answers .ok  { color: var(--accent-dark); font-weight: 700; }
  .detail-answers .bad { color: var(--danger); font-weight: 700; }

  .teacher-comment {
    margin-top: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(106,76,255,.06);
    border-left: 3px solid var(--primary);
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--dark);
  }
  .teacher-comment .tc-head {
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 4px;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }

  .pending-wrap {
    background: var(--white);
    border-radius: 28px;
    padding: 56px 40px;
    border: 1.5px solid var(--border);
    text-align: center;
    animation: slideIn .6s ease;
    position: relative;
    overflow: hidden;
  }
  .pending-wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #ffaa00, #ff7ac6, #6a4cff);
  }
  .hourglass {
    display: inline-grid; place-items: center;
    margin-bottom: 20px;
    color: #c47f00;
    animation: flip 3s ease-in-out infinite;
  }
  .hourglass .ico { width: 80px; height: 80px; stroke-width: 1; }
  @keyframes flip {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(180deg); }
  }
  .pending-title {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ffaa00, #6a4cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .pending-sub {
    font-size: 15px;
    color: var(--gray);
    max-width: 460px;
    margin: 0 auto 32px;
    line-height: 1.6;
  }
  .pending-note {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 999px;
    background: rgba(255,170,0,.12);
    color: #a06500;
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 28px;
  }
  .pending-note .ico { color: #c47f00; }
  html.dark .pending-note { background: rgba(255,170,0,.18); color: #ffc44d; }

  .cheat-fab-wrap {
    position: fixed;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 45;
  }
  .cheat-fab {
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: var(--white);
    border: 1.5px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.8,.3,1);
    box-shadow: 0 8px 20px -8px rgba(106,76,255,.3);
    color: var(--primary);
    position: relative;
  }
  .cheat-fab .ico { width: 22px; height: 22px; }
  .cheat-fab.accent { color: var(--accent-dark); }
  .cheat-fab:hover {
    transform: translateY(-3px) scale(1.05);
    border-color: var(--primary);
    box-shadow: 0 12px 28px -8px rgba(106,76,255,.5);
  }
  .cheat-fab .fab-label {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--gray);
    margin-top: -2px;
  }
  .cheat-fab::before {
    content: '';
    position: absolute;
    top: -3px;
    right: -3px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffaa00, #ff7ac6);
    box-shadow: 0 0 0 3px rgba(255,170,0,.25);
    animation: fabPulse 2s ease-in-out infinite;
  }
  @keyframes fabPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }

  .cheat-overlay {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(26, 26, 46, .72);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .cheat-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .cheat-panel {
    background: var(--white);
    border-radius: 24px;
    width: 100%;
    max-width: 1240px;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 40px 90px -30px rgba(0,0,0,.55),
      0 0 0 1px rgba(106,76,255,.15);
    transform: scale(.96) translateY(12px);
    opacity: 0;
    transition: transform .3s cubic-bezier(.2,.8,.3,1), opacity .25s ease;
    overflow: hidden;
  }
  .cheat-overlay.open .cheat-panel {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
  .cheat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 20px 28px;
    border-bottom: 1.5px solid var(--border);
    background: linear-gradient(135deg, rgba(106,76,255,.04), rgba(14,165,233,.03));
  }
  .cheat-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.3px;
    margin: 0;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .cheat-close {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: var(--white);
    border: 1.5px solid var(--border);
    color: var(--gray);
    cursor: pointer;
    transition: all .2s;
    flex-shrink: 0;
  }
  .cheat-close .ico { width: 16px; height: 16px; }
  .cheat-close:hover {
    background: rgba(224,67,92,.1);
    border-color: var(--danger);
    color: var(--danger);
    transform: rotate(90deg);
  }
  .cheat-body {
    padding: 20px 28px 28px;
    overflow: auto;
    flex: 1;
    background: var(--white);
  }
  .cheat-foot {
    padding: 12px 28px;
    border-top: 1.5px dashed var(--border);
    background: var(--light);
    text-align: center;
  }
  .cheat-hint {
    font-size: 12.5px;
    color: var(--gray);
    font-weight: 600;
  }
  .cheat-hint b { color: var(--primary); font-weight: 800; }

  .confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 14px;
    pointer-events: none;
    z-index: 999;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0.8;
    }
  }

  @media (max-width: 700px) {
    .cheat-fab-wrap {
      right: 12px;
      top: auto;
      bottom: 100px;
      transform: none;
      flex-direction: row;
    }
    .cheat-fab { width: 48px; height: 48px; }
    .cheat-fab .fab-label { display: none; }
    .result-wrap { padding: 32px 20px; }
    .pending-wrap { padding: 40px 20px; }
  }
</style>
</head>
