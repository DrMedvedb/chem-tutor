<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход ученика — Алхимичка</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,212,184,.12), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(0,168,148,.10), transparent 45%),
      var(--light);
    transition: background .35s ease;
  }
  html.dark .auth-wrap {
    background:
      radial-gradient(circle at 20% 30%, rgba(0,212,184,.16), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(0,212,184,.10), transparent 45%),
      var(--light);
  }
  .auth-card {
    position: relative;
    z-index: 2;
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 44px 40px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 25px 60px -15px rgba(0,212,184,.35);
    border: 1.5px solid var(--border);
  }
  html.dark .auth-card {
    box-shadow: 0 25px 60px -15px rgba(0,0,0,.7);
  }
  .auth-head { text-align: center; margin-bottom: 28px; }
  .auth-logo {
    width: 68px; height: 68px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    background: linear-gradient(135deg, rgba(0,212,184,.16), rgba(0,212,184,.04));
    margin-bottom: 14px;
  }
  .auth-head h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: var(--dark); }
  .auth-head p  { color: var(--gray); font-size: 14px; }
  .form-group { margin-bottom: 16px; }
  .hint {
    background: rgba(0,212,184,.08);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    color: var(--dark);
    margin-bottom: 20px;
  }
  html.dark .hint {
    background: rgba(0,212,184,.14);
    color: var(--dark);
  }
  .error-msg {
    background: rgba(224,67,92,.1);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
  }
  .error-msg.show { display: block; }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: var(--gray);
    font-size: 14px;
    transition: color .2s;
  }
  .back-link:hover { color: var(--accent-dark); }

  /* Кнопка темы */
  .theme-toggle-float {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    box-shadow: 0 8px 20px -8px rgba(106,76,255,.4);
  }
  html.dark .theme-toggle-float {
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.6);
  }
</style>
</head>
<body>

<!-- 🎨 Переключатель темы -->
<div class="theme-toggle-float" data-theme-toggle></div>

<div class="auth-wrap">
  <div class="blob blob-2"></div>

  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">👩‍🎓</div>
      <h1>Вход для ученика</h1>
      <p>Введите данные, которые выдал учитель</p>
    </div>

    <div class="hint">
      🔐 Логин и пароль выдаёт учитель. Если вы их не получили — обратитесь к нему.
    </div>

    <div class="error-msg" id="error"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="label">Логин (8 цифр)</label>
        <input class="input" name="username" inputmode="numeric" placeholder="58391047" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="label">Пароль</label>
        <input class="input" type="text" name="password" placeholder="oxygen7392" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-accent btn-block mt-2">Войти →</button>
    </form>

    <a href="index.html" class="back-link">← На главную</a>
  </div>
</div>

<script>
const API = '/api';
const errorBox = document.getElementById('error');
const form = document.getElementById('login-form');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  const fd = new FormData(form);
  try {
    const r = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: fd.get('username').trim(),
        password: fd.get('password').trim()
      })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Ошибка сервера');
    if (j.user.role !== 'student') {
      throw new Error('Это логин учителя. Войдите через страницу учителя.');
    }
    location.href = 'dashboard-student.html';
  } catch (err) {
    showError(err.message);
  }
});
</script>
</body>
</html>
