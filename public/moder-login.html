<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход модератора — Алхимичка</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(255, 216, 74, .16), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255, 155, 61, .12), transparent 45%),
      var(--light);
    transition: background .35s ease;
  }
  html.dark .auth-wrap {
    background:
      radial-gradient(circle at 20% 30%, rgba(255, 216, 74, .10), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255, 155, 61, .08), transparent 45%),
      var(--light);
  }
  .auth-card {
    position: relative;
    z-index: 2;
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 44px 40px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 25px 60px -15px rgba(255, 170, 0, .35);
    border: 1.5px solid var(--border);
  }
  html.dark .auth-card {
    box-shadow: 0 25px 60px -15px rgba(0,0,0,.7);
  }
  .auth-head { text-align: center; margin-bottom: 28px; }
  .auth-logo {
    width: 68px; height: 68px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    background: linear-gradient(135deg, rgba(255,216,74,.22), rgba(255,155,61,.10));
    margin-bottom: 14px;
    box-shadow: 0 8px 20px -8px rgba(255,170,0,.4);
  }
  .auth-head h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: var(--dark); }
  .auth-head p  { color: var(--gray); font-size: 14px; }

  .form-group { margin-bottom: 16px; }

  .hint {
    background: linear-gradient(135deg, rgba(255,216,74,.10), rgba(255,155,61,.05));
    border-left: 3px solid #ffaa00;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    color: var(--dark);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  html.dark .hint {
    background: linear-gradient(135deg, rgba(255,216,74,.14), rgba(255,155,61,.08));
  }
  .hint b { color: #c47f00; }
  html.dark .hint b { color: #ffd84a; }

  .error-msg {
    background: rgba(224,67,92,.1);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
  }
  .error-msg.show { display: block; }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: var(--gray);
    font-size: 14px;
    transition: color .2s;
  }
  .back-link:hover { color: #c47f00; }

  .theme-toggle-float {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    box-shadow: 0 8px 20px -8px rgba(106,76,255,.4);
  }
  html.dark .theme-toggle-float {
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.6);
  }

  .btn-moder {
    background: linear-gradient(135deg, #ffaa00, #ff9b3d);
    color: #fff;
    box-shadow: 0 8px 20px -8px rgba(255,170,0,.55);
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    width: 100%;
    border: none;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-moder:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px -8px rgba(255,170,0,.75);
  }
  .btn-moder:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
  }
</style>
</head>
<body>

<div class="theme-toggle-float" data-theme-toggle></div>

<div class="auth-wrap">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">👑</div>
      <h1>Панель модератора</h1>
      <p>Доступ только для администратора</p>
    </div>

    <div class="hint">
      🔒 Эта страница для <b>администратора платформы</b>. Если вы учитель или ученик — вернитесь на главную и выберите свою роль.
    </div>

    <div class="error-msg" id="error"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="label">Логин</label>
        <input class="input" name="username" autocomplete="username" required placeholder="admin">
      </div>
      <div class="form-group">
        <label class="label">Пароль</label>
        <input class="input" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-moder mt-2" id="submit-btn">Войти →</button>
    </form>

    <a href="index.html" class="back-link">← На главную</a>
  </div>
</div>

<script>
const API = '/api';
const errorBox = document.getElementById('error');
const form = document.getElementById('login-form');
const submitBtn = document.getElementById('submit-btn');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Входим…';

  const fd = new FormData(form);
  try {
    const r = await fetch(API + '/moder/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: fd.get('username').trim(),
        password: fd.get('password')
      })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Ошибка сервера');
    if (j.user.role !== 'moderator') {
      throw new Error('Это не аккаунт модератора');
    }
    location.href = 'moder.html';
  } catch (err) {
    showError(err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Войти →';
  }
});
</script>
</body>
</html>
