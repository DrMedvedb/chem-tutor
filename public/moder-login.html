<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход модератора — Алхимичка</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<style>
  .ico {
    width: 18px; height: 18px;
    flex-shrink: 0;
    stroke: currentColor;
    stroke-width: 1.75;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: inline-block;
    vertical-align: middle;
  }
  .ico-xl { width: 34px; height: 34px; stroke-width: 1.5; }
  .ico-sm { width: 15px; height: 15px; stroke-width: 2; }
  .btn-moder .ico { margin-right: 4px; }

  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(255, 216, 74, .16), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255, 155, 61, .12), transparent 45%),
      var(--light);
    transition: background .35s ease;
  }
  html.dark .auth-wrap {
    background:
      radial-gradient(circle at 20% 30%, rgba(255, 216, 74, .10), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255, 155, 61, .08), transparent 45%),
      var(--light);
  }
  .auth-card {
    position: relative;
    z-index: 2;
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 44px 40px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 25px 60px -15px rgba(255, 170, 0, .35);
    border: 1.5px solid var(--border);
  }
  html.dark .auth-card {
    box-shadow: 0 25px 60px -15px rgba(0,0,0,.7);
  }
  .auth-head { text-align: center; margin-bottom: 28px; }
  .auth-logo {
    width: 68px; height: 68px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(255,216,74,.22), rgba(255,155,61,.10));
    margin-bottom: 14px;
    color: #c47f00;
    box-shadow: 0 8px 20px -8px rgba(255,170,0,.4);
  }
  .auth-head h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: var(--dark); }
  .auth-head p  { color: var(--gray); font-size: 14px; }

  .form-group { margin-bottom: 16px; }

  .hint {
    background: linear-gradient(135deg, rgba(255,216,74,.10), rgba(255,155,61,.05));
    border-left: 3px solid #ffaa00;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    color: var(--dark);
    margin-bottom: 20px;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .hint .ico { color: #c47f00; flex-shrink: 0; margin-top: 2px; }
  html.dark .hint {
    background: linear-gradient(135deg, rgba(255,216,74,.14), rgba(255,155,61,.08));
  }
  .hint b { color: #c47f00; }
  html.dark .hint b { color: #ffd84a; }

  .error-msg {
    background: rgba(224,67,92,.1);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
  }
  .error-msg.show { display: block; }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: var(--gray);
    font-size: 14px;
    transition: color .2s;
  }
  .back-link:hover { color: #c47f00; }

  .theme-toggle-float {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    box-shadow: 0 8px 20px -8px rgba(106,76,255,.4);
  }
  html.dark .theme-toggle-float {
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.6);
  }

  .btn-moder {
    background: linear-gradient(135deg, #ffaa00, #ff9b3d);
    color: #fff;
    box-shadow: 0 8px 20px -8px rgba(255,170,0,.55);
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    width: 100%;
    border: none;
    cursor: pointer;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-moder:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px -8px rgba(255,170,0,.75);
  }
  .btn-moder:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <defs>
    <symbol id="i-shield" viewBox="0 0 24 24">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
      <path d="m9 12 2 2 4-4"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24">
      <path d="M5 12h14"/>
      <path d="m12 5 7 7-7 7"/>
    </symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24">
      <path d="m12 19-7-7 7-7"/>
      <path d="M19 12H5"/>
    </symbol>
  </defs>
</svg>

<div class="theme-toggle-float" data-theme-toggle></div>

<div class="auth-wrap">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">
        <svg class="ico ico-xl"><use href="#i-shield"/></svg>
      </div>
      <h1>Панель модератора</h1>
      <p>Доступ только для администратора</p>
    </div>

    <div class="hint">
      <svg class="ico ico-sm"><use href="#i-lock"/></svg>
      <span>Эта страница для <b>администратора платформы</b>. Если вы учитель или ученик — вернитесь на главную и выберите свою роль.</span>
    </div>

    <div class="error-msg" id="error"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="label">Логин</label>
        <input class="input" name="username" autocomplete="username" required placeholder="Введите логин">
      </div>
      <div class="form-group">
        <label class="label">Пароль</label>
        <input class="input" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-moder mt-2" id="submit-btn">
        Войти <svg class="ico ico-sm"><use href="#i-arrow-right"/></svg>
      </button>
    </form>

    <a href="index.html" class="back-link">
      <svg class="ico ico-sm"><use href="#i-arrow-left"/></svg> На главную
    </a>
  </div>
</div>

<script>
const API = '/api';
const errorBox = document.getElementById('error');
const form = document.getElementById('login-form');
const submitBtn = document.getElementById('submit-btn');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Входим…';

  const fd = new FormData(form);
  try {
    const r = await fetch(API + '/moder/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: fd.get('username').trim(),
        password: fd.get('password')
      })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Ошибка сервера');
    if (j.user.role !== 'moderator') {
      throw new Error('Это не аккаунт модератора');
    }
    location.href = 'moder.html';
  } catch (err) {
    showError(err.message);
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'Войти <svg class="ico ico-sm"><use href="#i-arrow-right"/></svg>';
  }
});
</script>
<script src="js/icons.js"></script>
</body>
</html>
