<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тема — Алхимичка</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<style>
  /* ═══ ИКОНКИ ═══ */
  .ico {
    width: 18px; height: 18px;
    flex-shrink: 0;
    stroke: currentColor;
    stroke-width: 1.75;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: inline-block;
    vertical-align: middle;
  }
  .ico-lg { width: 22px; height: 22px; stroke-width: 1.5; }
  .ico-sm { width: 15px; height: 15px; stroke-width: 2; }
  h2 .ico, h3 .ico { margin-right: 8px; vertical-align: -3px; }
  .st-back .ico { margin-right: 4px; vertical-align: -3px; }
  .st-mat-head .ic .ico {
    width: 22px; height: 22px;
    color: var(--accent-dark);
  }

  .st-wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }

  .st-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .st-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--gray);
    font-size: 14px;
    font-weight: 600;
    transition: color .2s;
  }
  .st-back:hover { color: var(--accent-dark); }

  .st-head {
    background: var(--white);
    border-radius: 24px;
    padding: 32px;
    border: 1.5px solid var(--border);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .st-head::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), #38bdf8, var(--primary));
  }
  .st-head h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.5px;
    margin-bottom: 8px;
    color: var(--dark);
  }
  .st-head .desc { color: var(--gray); font-size: 15px; }

  .grade-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .2px;
    text-transform: uppercase;
    margin-top: 10px;
  }
  .grade-badge.g-junior { background: rgba(255,170,0,.16); color: #c47f00; }
  .grade-badge.g-8      { background: rgba(74,144,226,.16); color: #2a6fc4; }
  .grade-badge.g-9      { background: rgba(78,203,113,.16); color: #2a8a4a; }
  .grade-badge.g-10     { background: rgba(106,76,255,.16); color: var(--primary); }
  .grade-badge.g-11     { background: rgba(255,107,107,.16); color: #c43a3a; }
  .grade-badge.g-adult  { background: rgba(14,165,233,.16); color: var(--accent-dark); }

  html.dark .grade-badge.g-junior { background: rgba(255,170,0,.22); color: #ffc44d; }
  html.dark .grade-badge.g-8      { background: rgba(74,144,226,.22); color: #7ab4ff; }
  html.dark .grade-badge.g-9      { background: rgba(78,203,113,.22); color: #7de29a; }
  html.dark .grade-badge.g-10     { background: rgba(122,92,255,.22); color: #b8a6ff; }
  html.dark .grade-badge.g-11     { background: rgba(255,107,107,.22); color: #ff9b9b; }
  html.dark .grade-badge.g-adult  { background: rgba(14,165,233,.22); color: #7ad8f8; }

  .section {
    background: var(--white);
    border-radius: 24px;
    padding: 28px;
    border: 1.5px solid var(--border);
    margin-bottom: 24px;
  }
  .section h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--dark);
  }

  .st-mat {
    border-radius: 16px;
    background: var(--light);
    border: 1.5px solid transparent;
    transition: all .2s;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .st-mat:hover { border-color: var(--accent); }
  .st-mat-head {
    padding: 16px;
    display: flex;
    gap: 14px;
    align-items: center;
    cursor: pointer;
  }
  .st-mat-head .ic {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--white);
    display: grid; place-items: center;
    flex-shrink: 0;
    box-shadow: 0 4px 10px -4px rgba(26,26,46,.1);
  }
  .st-mat-head .body { flex: 1; min-width: 0; }
  .st-mat-head .title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 2px;
    color: var(--dark);
  }
  .st-mat-head .sub {
    color: var(--gray);
    font-size: 13px;
  }
  .st-mat-head .chev {
    color: var(--gray);
    transition: transform .3s;
    display: grid; place-items: center;
  }
  .st-mat.open .chev { transform: rotate(90deg); }

  .st-mat-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease, padding .3s ease;
    padding: 0 16px;
  }
  .st-mat.open .st-mat-body {
    max-height: 800px;
    padding: 0 16px 16px;
  }
  .st-mat-body .inner {
    padding: 16px;
    background: var(--white);
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--dark);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .st-mat-body a {
    color: var(--accent-dark);
    font-weight: 600;
    word-break: break-all;
  }

  .test-cta {
    text-align: center;
    padding: 32px 20px;
    background: linear-gradient(135deg, rgba(14,165,233,.06), rgba(106,76,255,.05));
    border-radius: 18px;
    border: 1.5px dashed var(--border);
  }
  html.dark .test-cta {
    background: linear-gradient(135deg, rgba(14,165,233,.10), rgba(122,92,255,.08));
  }
  .test-cta .emoji {
    display: grid; place-items: center;
    margin-bottom: 12px;
    color: var(--accent-dark);
  }
  .test-cta .emoji .ico { width: 42px; height: 42px; stroke-width: 1.25; }
  .test-cta h3 {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--dark);
  }
  .test-cta p { color: var(--gray); font-size: 14px; margin-bottom: 20px; }

  .best-result {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(14,165,233,.12);
    color: var(--accent-dark);
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 16px;
  }

  @media (max-width: 640px) {
    .st-head h1 { font-size: 24px; }
    .st-wrap { padding: 20px 16px 60px; }
  }
</style>
</head>
<body>

<!-- ═══ SVG-СПРАЙТ ═══ -->
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <defs>

    </symbol>

      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
      <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
      <path d="M10 9H8"/>
      <path d="M16 13H8"/>
      <path d="M16 17H8"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" x2="12" y1="15" y2="3"/>
    </symbol>
    <symbol id="i-flask" viewBox="0 0 24 24">
      <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/>
      <path d="M8.5 2h7"/>
      <path d="M7 16h10"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </symbol>
    <symbol id="i-chevr" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6"/>
    </symbol>
  </defs>
</svg>

<div class="st-wrap">
  <div class="st-topbar">
    <a href="dashboard-student.html" class="st-back">
      <svg class="ico ico-sm"><use href="#i-arrow-left"/></svg> Мои темы
    </a>
    <div data-theme-toggle></div>
  </div>

  <header class="st-head">
    <h1 id="t-title">Загрузка…</h1>
    <div id="t-grade-wrap"></div>
    <p class="desc" id="t-desc" style="margin-top:8px"></p>
  </header>

  <section class="section">
    <h2><svg class="ico ico-lg"><use href="#i-file-text"/></svg> Материалы</h2>
    <div id="materials"></div>
  </section>

  <section class="section">
    <h2><svg class="ico ico-lg"><use href="#i-flask"/></svg> Пройти тест</h2>
    <div id="test-block"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="js/student-topic.js"></script>
<script src="js/icons.js"></script>
</body>
</html>
