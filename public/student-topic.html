<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тема — Алхимичка</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<style>
  /* ═══ ИКОНКИ ═══ */
  .ico {
    width: 18px; height: 18px;
    flex-shrink: 0;
    stroke: currentColor;
    stroke-width: 1.75;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: inline-block;
    vertical-align: middle;
  }
  .ico-lg { width: 22px; height: 22px; stroke-width: 1.5; }
  .ico-xl { width: 32px; height: 32px; stroke-width: 1.5; }
  .ico-sm { width: 15px; height: 15px; stroke-width: 2; }
  h2 .ico, h3 .ico { margin-right: 8px; vertical-align: -3px; }
  .st-back .ico { margin-right: 4px; vertical-align: -3px; }
  .st-mat-head .ic .ico {
    width: 22px; height: 22px;
    color: var(--accent-dark);
  }

  .st-wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }

  .st-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .st-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--gray);
    font-size: 14px;
    font-weight: 600;
    transition: color .2s;
  }
  .st-back:hover { color: var(--accent-dark); }

  .st-head {
    background: var(--white);
    border-radius: 24px;
    padding: 32px;
    border: 1.5px solid var(--border);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .st-head::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), #38bdf8, var(--primary));
  }
  .st-head h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.5px;
    margin-bottom: 8px;
    color: var(--dark);
  }
  .st-head .desc { color: var(--gray); font-size: 15px; }

  .grade-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .2px;
    text-transform: uppercase;
    margin-top: 10px;
  }
  .grade-badge.g-junior { background: rgba(255,170,0,.16); color: #c47f00; }
  .grade-badge.g-8      { background: rgba(74,144,226,.16); color: #2a6fc4; }
  .grade-badge.g-9      { background: rgba(78,203,113,.16); color: #2a8a4a; }
  .grade-badge.g-10     { background: rgba(106,76,255,.16); color: var(--primary); }
  .grade-badge.g-11     { background: rgba(255,107,107,.16); color: #c43a3a; }
  .grade-badge.g-adult  { background: rgba(14,165,233,.16); color: var(--accent-dark); }

  html.dark .grade-badge.g-junior { background: rgba(255,170,0,.22); color: #ffc44d; }
  html.dark .grade-badge.g-8      { background: rgba(74,144,226,.22); color: #7ab4ff; }
  html.dark .grade-badge.g-9      { background: rgba(78,203,113,.22); color: #7de29a; }
  html.dark .grade-badge.g-10     { background: rgba(122,92,255,.22); color: #b8a6ff; }
  html.dark .grade-badge.g-11     { background: rgba(255,107,107,.22); color: #ff9b9b; }
  html.dark .grade-badge.g-adult  { background: rgba(14,165,233,.22); color: #7ad8f8; }

  .section {
    background: var(--white);
    border-radius: 24px;
    padding: 28px;
    border: 1.5px solid var(--border);
    margin-bottom: 24px;
  }
  .section h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--dark);
  }

  /* ─── СЕТКА КАРТИНОК (ГАЛЕРЕЯ) ─── */
  .image-gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .gallery-item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 1.5px solid var(--border);
    background: #fff;
    cursor: pointer;
    aspect-ratio: 4 / 3;
    transition: all .2s ease;
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease;
  }
  .gallery-item:hover {
    border-color: var(--accent);
    box-shadow: 0 8px 20px -8px rgba(14,165,233,.4);
    transform: translateY(-2px);
  }
  .gallery-item:hover img {
    transform: scale(1.05);
  }
  .gallery-item-overlay {
    position: absolute;
    inset: 0;
    background: rgba(26,26,46,.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: opacity .2s ease;
    backdrop-filter: blur(2px);
  }
  .gallery-item:hover .gallery-item-overlay {
    opacity: 1;
  }

  /* ─── ОСТАЛЬНЫЕ МАТЕРИАЛЫ ─── */
  .st-mat {
    border-radius: 16px;
    background: var(--light);
    border: 1.5px solid transparent;
    transition: all .2s;
    overflow: hidden;
  }
  .st-mat:hover { border-color: var(--accent); }
  .st-mat-head {
    padding: 16px;
    display: flex;
    gap: 14px;
    align-items: center;
    cursor: pointer;
  }
  .st-mat-head .ic {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--white);
    display: grid; place-items: center;
    flex-shrink: 0;
    box-shadow: 0 4px 10px -4px rgba(26,26,46,.1);
  }
  .st-mat-head .body { flex: 1; min-width: 0; }
  .st-mat-head .title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 2px;
    color: var(--dark);
  }
  .st-mat-head .sub {
    color: var(--gray);
    font-size: 13px;
  }
  .st-mat-head .chev {
    color: var(--gray);
    transition: transform .3s;
    display: grid; place-items: center;
  }
  .st-mat.open .chev { transform: rotate(90deg); }

  .st-mat-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease, padding .3s ease;
    padding: 0 16px;
  }
  .st-mat.open .st-mat-body {
    max-height: 2000px;
    padding: 0 16px 16px;
  }
  .st-mat-body .inner {
    padding: 16px;
    background: var(--white);
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--dark);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .st-mat-body a { color: var(--accent-dark); font-weight: 600; word-break: break-all; }

  /* ─── PDF блок ─── */
  .material-pdf-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 10px 0;
  }

  /* ─── Лайтбокс (галерея) ─── */
  .lightbox-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(10, 10, 15, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  .lightbox-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .lightbox-content {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .lightbox-content img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transform: scale(0.95);
    transition: transform .3s cubic-bezier(.2,.8,.3,1);
  }
  .lightbox-overlay.show .lightbox-content img {
    transform: scale(1);
  }
  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all .2s;
    z-index: 10;
  }
  .lightbox-close:hover {
    background: rgba(224, 67, 92, 0.8);
    transform: rotate(90deg);
  }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all .2s;
    z-index: 10;
    user-select: none;
  }
  .lightbox-nav:hover {
    background: rgba(255,255,255,.25);
    transform: translateY(-50%) scale(1.1);
  }
  .lightbox-prev { left: 24px; }
  .lightbox-next { right: 24px; }
  .lightbox-nav.hidden { display: none; }

  .lightbox-caption {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.8);
    font-size: 14px;
    font-weight: 600;
    background: rgba(0,0,0,.5);
    padding: 8px 20px;
    border-radius: 99px;
    backdrop-filter: blur(4px);
    max-width: 80%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ─── Модалка PDF ─── */
  .pdf-viewer-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(26, 26, 46, 0.8);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn .2s ease;
  }
  .pdf-viewer-container {
    width: 100%;
    max-width: 1000px;
    height: 90vh;
    background: #fff;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
  }
  .pdf-viewer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1.5px solid var(--border);
    background: var(--light);
  }
  .pdf-viewer-title {
    font-weight: 800;
    color: var(--dark);
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pdf-viewer-close {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--white);
    border: 1.5px solid var(--border);
    color: var(--gray);
    display: grid; place-items: center;
    cursor: pointer;
    transition: all .2s;
  }
  .pdf-viewer-close:hover {
    background: rgba(224,67,92,.1);
    color: var(--danger);
    border-color: var(--danger);
  }
  .pdf-viewer-body {
    flex: 1;
    background: #f0f0f0;
  }
  .pdf-viewer-body iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 640px) {
    .st-head h1 { font-size: 24px; }
    .st-wrap { padding: 20px 16px 60px; }
    .lightbox-content { padding: 10px; }
    .lightbox-nav { width: 44px; height: 44px; }
    .lightbox-prev { left: 10px; }
    .lightbox-next { right: 10px; }
    .lightbox-close { top: 12px; right: 12px; width: 40px; height: 40px; }
    .pdf-viewer-container { height: 100vh; max-height: 100vh; border-radius: 0; }
    .pdf-viewer-overlay { padding: 0; }
  }
</style>
</head>
<body>

  <div class="st-topbar">
    <a href="dashboard-student.html" class="st-back">
      <svg class="ico ico-sm"><use href="#i-arrow-left"/></svg> Мои темы
    </a>
