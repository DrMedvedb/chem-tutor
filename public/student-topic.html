<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тема — Алхимичка</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<style>
  .st-wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }

  .st-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .st-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--gray);
    font-size: 14px;
    font-weight: 600;
    transition: color .2s;
  }
  .st-back:hover { color: var(--accent-dark); }

  .st-head {
    background: var(--white);
    border-radius: 24px;
    padding: 32px;
    border: 1.5px solid var(--border);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .st-head::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), #48e0c6, var(--primary));
  }
  .st-head h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.5px;
    margin-bottom: 8px;
    color: var(--dark);
  }
  .st-head .desc { color: var(--gray); font-size: 15px; }

  /* ⭐ Бейдж класса */
  .grade-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .2px;
    text-transform: uppercase;
    margin-top: 10px;
  }
  .grade-badge.g-junior { background: rgba(255,170,0,.16); color: #c47f00; }
  .grade-badge.g-8      { background: rgba(74,144,226,.16); color: #2a6fc4; }
  .grade-badge.g-9      { background: rgba(78,203,113,.16); color: #2a8a4a; }
  .grade-badge.g-10     { background: rgba(106,76,255,.16); color: var(--primary); }
  .grade-badge.g-11     { background: rgba(255,107,107,.16); color: #c43a3a; }
  .grade-badge.g-adult  { background: rgba(0,212,184,.16); color: var(--accent-dark); }

  html.dark .grade-badge.g-junior { background: rgba(255,170,0,.22); color: #ffc44d; }
  html.dark .grade-badge.g-8      { background: rgba(74,144,226,.22); color: #7ab4ff; }
  html.dark .grade-badge.g-9      { background: rgba(78,203,113,.22); color: #7de29a; }
  html.dark .grade-badge.g-10     { background: rgba(122,92,255,.22); color: #b8a6ff; }
  html.dark .grade-badge.g-11     { background: rgba(255,107,107,.22); color: #ff9b9b; }
  html.dark .grade-badge.g-adult  { background: rgba(0,212,184,.22); color: #7affd9; }

  .section {
    background: var(--white);
    border-radius: 24px;
    padding: 28px;
    border: 1.5px solid var(--border);
    margin-bottom: 24px;
  }
  .section h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--dark);
  }

  .st-mat {
    border-radius: 16px;
    background: var(--light);
    border: 1.5px solid transparent;
    transition: all .2s;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .st-mat:hover { border-color: var(--accent); }
  .st-mat-head {
    padding: 16px;
    display: flex;
    gap: 14px;
    align-items: center;
    cursor: pointer;
  }
  .st-mat-head .ic {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--white);
    display: grid; place-items: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 4px 10px -4px rgba(26,26,46,.1);
  }
  .st-mat-head .body { flex: 1; min-width: 0; }
  .st-mat-head .title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 2px;
    color: var(--dark);
  }
  .st-mat-head .sub {
    color: var(--gray);
    font-size: 13px;
  }
  .st-mat-head .chev {
    color: var(--gray);
    font-size: 14px;
    transition: transform .3s;
  }
  .st-mat.open .chev { transform: rotate(90deg); }

  .st-mat-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease, padding .3s ease;
    padding: 0 16px;
  }
  .st-mat.open .st-mat-body {
    max-height: 800px;
    padding: 0 16px 16px;
  }
  .st-mat-body .inner {
    padding: 16px;
    background: var(--white);
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--dark);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .st-mat-body a {
    color: var(--accent-dark);
    font-weight: 600;
    word-break: break-all;
  }

  .test-cta {
    text-align: center;
    padding: 32px 20px;
    background: linear-gradient(135deg, rgba(0,212,184,.06), rgba(106,76,255,.05));
    border-radius: 18px;
    border: 1.5px dashed var(--border);
  }
  html.dark .test-cta {
    background: linear-gradient(135deg, rgba(0,212,184,.10), rgba(122,92,255,.08));
  }
  .test-cta .emoji { font-size: 48px; margin-bottom: 12px; display: block; }
  .test-cta h3 {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--dark);
  }
  .test-cta p { color: var(--gray); font-size: 14px; margin-bottom: 20px; }

  .best-result {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(0,212,184,.12);
    color: var(--accent-dark);
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 16px;
  }

  @media (max-width: 640px) {
    .st-head h1 { font-size: 24px; }
    .st-wrap { padding: 20px 16px 60px; }
  }
</style>
</head>
<body>

<div class="st-wrap">
  <div class="st-topbar">
    <a href="dashboard-student.html" class="st-back">← Мои темы</a>
    <div data-theme-toggle></div>
  </div>

  <header class="st-head">
    <h1 id="t-title">Загрузка…</h1>
    <div id="t-grade-wrap"></div>
    <p class="desc" id="t-desc" style="margin-top:8px"></p>
  </header>

  <section class="section">
    <h2>📄 Материалы</h2>
    <div id="materials"></div>
  </section>

  <section class="section">
    <h2>🧪 Пройти тест</h2>
    <div id="test-block"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="js/student-topic.js"></script>
</body>
</html>
